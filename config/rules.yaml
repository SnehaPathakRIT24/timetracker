# Classification rules — checked BEFORE AI (free and instant)
# match_type: contains | startswith | exact | regex
# field: window_title | app_name | url
# priority: lower number = checked first

rules:
  # ── Be Rolling Media ─────────────────────────────────────────────────────────
  - pattern: "premiere pro"
    match_type: contains
    field: app_name
    category: "Be Rolling Media"
    priority: 1

  - pattern: "Adobe Premiere Pro"
    match_type: contains
    field: window_title
    category: "Be Rolling Media"
    priority: 1

  - pattern: "DaVinci Resolve"
