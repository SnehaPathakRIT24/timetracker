    category: "Be Rolling Media"
    priority: 1

  - pattern: "CapCut"
    match_type: contains
    field: app_name
    category: "Be Rolling Media"
    priority: 1

  - pattern: "berolling"
    match_type: contains
    field: window_title
    category: "Be Rolling Media"
    priority: 2

  - pattern: "be rolling"
